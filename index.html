<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Between the Slides</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Patrick+Hand&family=Kalam:wght@400;700&family=Nunito:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,700;1,400&family=Courier+Prime:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600&display=swap">
<style>
/* Layout: one centred column of white slide cards holding the extracted text; sticky toolbar on top */
:root{
  --bg:#eceff4; --surface:#ffffff; --ink:#1b2330; --muted:#5d6878; --line:#d3d9e3; --accent:#2747c9;
  --card:#ffffff; --card-ink:#1b2330; --card-muted:#6b7686;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --ui:system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--surface:#1b212b;--ink:#e6eaf0;--muted:#9aa5b4;--line:#2e3744;--accent:#8fa6ff;--card:#f4f6fa;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161d;--surface:#1b212b;--ink:#e6eaf0;--muted:#9aa5b4;--line:#2e3744;--accent:#8fa6ff;--card:#f4f6fa;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--ui)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{max-width:960px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
h1{font-family:var(--display);font-size:18px;margin:0 6px 0 0;font-weight:600}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
button,select,label.btn{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:focus-visible,select:focus-visible,label.btn:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.sw{width:26px;height:26px;padding:0;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
input[type=color]{width:30px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.hint{width:100%;font-size:12px;color:var(--muted)}
.savewrap{position:relative}
.savemenu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;min-width:250px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column;gap:4px}
.savemenu button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:none;background:transparent;padding:8px 10px;border-radius:6px}
.savemenu button:hover,.savemenu button:focus-visible{background:var(--bg)}
.savemenu small{color:var(--muted);font-size:12px}
main.paged{max-width:none;align-items:center;gap:24px}
.sheet{width:var(--sheet-w);min-height:var(--sheet-h);background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);padding:48px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;flex-shrink:0;color:#1b2330}
.sheet > .slide{box-shadow:none;border-radius:0;flex-shrink:0}
.sheet > .file-head{margin:0;color:#1b2330}
.sheet > .cont{margin-top:0}
.savemenu .layout{display:flex;flex-direction:column;gap:4px;padding:6px 10px 8px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:2px}
.savemenu .layout select{width:100%}
.spacer{flex:1}
main{max-width:960px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}

/* slide cards: original content */
.slide{background:var(--card);color:var(--card-ink);border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.15);padding:22px 28px 26px;cursor:text;min-width:0;overflow-wrap:anywhere;line-height:1.35}
.file-head{font-family:var(--display);font-weight:600;font-size:26px;margin:14px 0 0;text-wrap:balance;overflow-wrap:anywhere}
.slide-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--card-muted);margin-bottom:10px;cursor:default;display:flex;gap:10px;align-items:center}
.slide .blk{margin:0 0 .45em}
.slide img{display:block;max-width:100%;height:auto;margin:.6em 0}
.slide table{border-collapse:collapse;margin:.6em 0;display:block;overflow-x:auto}
.slide td,.slide th{border:1px solid #c9d0db;padding:4px 8px;vertical-align:top}
.bul{display:inline-block;min-width:1.2em}
details.orig{cursor:default;margin-top:12px;font-size:13px;color:var(--card-muted)}
details.orig summary{cursor:pointer}
details.orig img{border:1px solid #d3d9e3}

/* your notes */
.mine{outline:none;border-radius:3px;font-family:Caveat,cursive;font-size:24px;color:#1f4fd1;cursor:text;line-height:1.3}
.slide img.formula{max-width:100%;margin:.3em 0}
span.mine{padding:0 .2em;background:transparent;border:1px solid #9aa3b2}
div.mine,li.mine{display:block;list-style:none;padding:4px 8px;margin:.2em 0 .5em;background:transparent;border:1px solid #9aa3b2}
.pagecard{padding:0;overflow:hidden;background:#fff}
.strip{position:relative;overflow:hidden;width:100%;max-width:100%;background-image:var(--pg);background-size:100% auto;background-repeat:no-repeat;cursor:text;font-size:0;color:transparent;container-type:inline-size}
.tl{position:absolute;white-space:pre;line-height:1;transform-origin:0 0;color:transparent;font-family:Arial,Helvetica,sans-serif;cursor:text}
.tl::selection{background:rgba(39,71,201,.3);color:transparent}
.gapline{position:absolute;left:0;right:0;border-top:2px dashed var(--accent);pointer-events:none;z-index:2}
.gappill{position:absolute;left:8px;transform:translateY(-50%);z-index:3;font:600 13px var(--ui);padding:5px 12px;background:var(--accent);color:var(--surface);border:none;border-radius:999px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25);user-select:none;-webkit-user-select:none}
.notebox{position:relative;display:flex;flex-direction:column;width:100%;max-width:100%;margin:.2em 0 .5em;box-sizing:border-box}
.notebox > .mine{flex:1 1 auto;min-height:0;overflow:visible;margin:0 !important;padding-right:22px}
.notebox.inline{display:inline-flex;width:auto;vertical-align:baseline;margin:0 .15em}
.notebox.inline > .mine{padding:0 14px 0 .25em}
.notebox:hover > .mine{box-shadow:0 0 0 1px var(--accent)}
.grip{position:absolute;width:12px;height:12px;background:#fff;border:2px solid var(--accent);border-radius:2px;box-sizing:border-box;touch-action:none;z-index:3;opacity:0;transition:opacity .15s}
.notebox:hover > .grip,.notebox:focus-within > .grip{opacity:1}
.g-move{left:-10px;top:-10px;width:22px;height:22px;border-radius:50%;cursor:move;display:flex;align-items:center;justify-content:center;font:13px/1 var(--ui);color:var(--accent);user-select:none;-webkit-user-select:none}
.notebox.moving{opacity:.9;z-index:6}
.notebox.moving > .mine{box-shadow:0 6px 18px rgba(0,0,0,.22);background:rgba(255,255,255,.85)}
@media (hover:none){.grip{opacity:1;width:16px;height:16px}.g-move{width:26px;height:26px}}
.g-se{right:0;bottom:0;cursor:nwse-resize}
.g-e{right:0;top:50%;transform:translateY(-50%);cursor:ew-resize}
.g-s{bottom:0;left:50%;transform:translateX(-50%);cursor:ns-resize}
.notebox.inline > .g-s{display:none}
.pagecard > div.mine{margin:0 14px;padding:8px 14px}
.pagecard > .notebox{margin:4px 14px;width:calc(100% - 28px);max-width:calc(100% - 28px)}
.pagecard > .notebox > .mine{padding:8px 22px 8px 14px}
.mine:focus{box-shadow:0 0 0 2px var(--accent)}
.mine:empty::before{content:"type here";opacity:.45}

.empty{text-align:center;padding:60px 16px;color:var(--muted)}
.empty h2{font-family:var(--display);color:var(--ink);font-size:26px;margin:0 0 8px;text-wrap:balance}
.empty p{max-width:54ch;margin:0 auto 14px;line-height:1.5}
#status{font-size:13px;color:var(--muted)}
</style>

<header>
  <div class="bar">
    <h1>Between the Slides</h1>
    <label class="btn primary" for="file">Open file<input id="file" type="file" accept=".pdf,.pptx,.docx,.html,image/*" multiple hidden></label>
    <div class="tools" id="tools">
      <select id="font" aria-label="Your font">
        <option value="Caveat">Caveat (handwriting)</option>
        <option value="Patrick Hand">Patrick Hand</option>
        <option value="Kalam">Kalam</option>
        <option value="Nunito">Nunito</option>
        <option value="Lora">Lora</option>
        <option value="Courier Prime">Courier Prime</option>
      </select>
      <select id="size" aria-label="Your text size"></select>
      <span id="swatches" style="display:flex;gap:4px;align-items:center"></span>
      <input type="color" id="color" value="#1f4fd1" aria-label="Custom colour">
      <button id="b" title="Bold"><b>B</b></button>
      <button id="i" title="Italic"><i>I</i></button>
      <button id="u" title="Underline"><u>U</u></button>
    </div>
    <span class="spacer"></span>
    <select id="layout" aria-label="Page layout" title="Page layout">
      <option value="default">Layout: Default</option>
      <option value="a4-portrait">A4 portrait</option>
      <option value="a4-landscape">A4 landscape</option>
      <option value="a3-portrait">A3 portrait</option>
      <option value="a3-landscape">A3 landscape</option>
    </select>
    <span class="savewrap">
      <button id="save" class="primary" aria-haspopup="true" aria-expanded="false">Download ▾</button>
      <div class="savemenu" id="saveMenu" hidden>
        <button type="button" data-kind="pdf"><strong>PDF</strong><small>Your pages and notes, in the layout you picked</small></button>
        <button type="button" data-kind="notebook"><strong>Notebook file</strong><small>Open it later on any device to keep editing</small></button>
      </div>
    </span>
    <button id="clear">Clear all</button>
    <div class="hint" id="hint"></div>
    <div id="status" aria-live="polite"></div>
  </div>
</header>

<main id="main"></main>

<template id="emptyTpl">
  <div class="empty">
    <h2>Open your slides to start taking notes</h2>
    <p>Open a PowerPoint (.pptx), PDF or Word (.docx) file. The text comes in with its headings, bold, bullets and the main pictures. Nothing in it can be changed.</p>
    <p>Then click anywhere in the text to type your own words right there, in your own font, size and colour.</p>
  </div>
</template>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
// a copy of this app, for the downloadable notebook file
const APP_HTML = (() => { const c = document.body.cloneNode(true); c.querySelector('#notebook-data')?.remove(); const m = c.querySelector('#main'); if (m) m.innerHTML = ''; return c.innerHTML; })();
const $ = s => document.querySelector(s);
const main = $('#main');
const COLORS = ['#1f4fd1','#c62828','#2e7d32','#7b1fa2','#d35400','#1d1d1f'];
const SIZES = [14,16,18,20,24,28,32,40];
let style = {font:'Caveat', size:24, color:'#1f4fd1'};
let active = null, savedRange = null, slideCount = 0;
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const status = t => $('#status').textContent = t || '';

/* ================= toolbar ================= */
SIZES.forEach(s => $('#size').add(new Option(s + ' pt', s)));
COLORS.forEach(c => {
  const b = document.createElement('button');
  b.className = 'sw'; b.style.background = c; b.dataset.c = c; b.setAttribute('aria-label', 'Colour ' + c);
  $('#swatches').append(b);
});
function showStyle(s){
  $('#font').value = s.font; $('#size').value = s.size; $('#color').value = s.color;
  document.querySelectorAll('.sw').forEach(b => b.setAttribute('aria-pressed', b.dataset.c === s.color));
}
function hint(){
  $('#hint').textContent = !active
    ? 'On a PDF page, point at a spot and press “+ Add note here”; the page opens up between the lines. You can select and copy the page text. Drag a note’s edges to resize it, or its ✥ handle to move it. The style above is used for new notes.'
    : savedRange && !savedRange.collapsed ? 'Styling: the selected words.' : 'Styling: this whole note. Select words to style only those.';
}
showStyle(style); hint();
document.querySelectorAll('#tools button').forEach(b => b.addEventListener('mousedown', e => e.preventDefault()));

document.addEventListener('selectionchange', () => {
  const sel = getSelection(); if (!sel.rangeCount) return;
  const r = sel.getRangeAt(0), n = r.commonAncestorContainer;
  const el = (n.nodeType === 1 ? n : n.parentElement)?.closest('.mine');
  if (el) { active = el; savedRange = r.cloneRange(); showStyle(noteStyle(el)); hint(); }
});
document.addEventListener('mousedown', e => {
  if (!e.target.closest('.mine, .notebox, .gappill, header')) { active = null; savedRange = null; showStyle(style); hint(); }
});
function noteStyle(el){
  return {font: el.style.fontFamily.split(',')[0].replace(/"/g,'').trim() || style.font,
          size: parseInt(el.style.fontSize) || style.size, color: toHex(el.style.color) || style.color};
}
function toHex(c){ const m = c && c.match(/\d+/g); return m ? '#' + m.slice(0,3).map(x => (+x).toString(16).padStart(2,'0')).join('') : c; }
function restoreSel(){ active.focus(); if (savedRange) { const s = getSelection(); s.removeAllRanges(); s.addRange(savedRange); } }

function apply(kind, value){
  if (!active || !document.body.contains(active)) { active = null; style[kind] = value; showStyle(style); saveSoon(); return; }
  restoreSel();
  if (savedRange && !savedRange.collapsed) {
    document.execCommand('styleWithCSS', false, true);
    if (kind === 'font') document.execCommand('fontName', false, value);
    if (kind === 'color') document.execCommand('foreColor', false, value);
    if (kind === 'size') {
      document.execCommand('styleWithCSS', false, false);
      document.execCommand('fontSize', false, '7');
      active.querySelectorAll('font[size="7"]').forEach(f => { const s = document.createElement('span'); s.style.fontSize = value + 'px'; while (f.firstChild) s.append(f.firstChild); f.replaceWith(s); });
      active.querySelectorAll('span').forEach(s => { if (s.style.fontSize === 'xxx-large') s.style.fontSize = value + 'px'; });
    }
  } else {
    const prop = {font:'fontFamily', size:'fontSize', color:'color'}[kind];
    active.style[prop] = kind === 'font' ? `"${value}", cursive` : kind === 'size' ? value + 'px' : value;
    active.querySelectorAll('*').forEach(el => { el.style[prop] = ''; if (el.tagName === 'FONT') el.removeAttribute({font:'face',color:'color',size:'size'}[kind]); });
  }
  const s = getSelection(); savedRange = s.rangeCount ? s.getRangeAt(0).cloneRange() : null;
  showStyle({...noteStyle(active), [kind]: value});
  saveSoon();
}
$('#font').onchange = e => apply('font', e.target.value);
$('#size').onchange = e => apply('size', +e.target.value);
$('#color').oninput = e => apply('color', e.target.value);
$('#swatches').onclick = e => { const c = e.target.dataset?.c; if (c) apply('color', c); };
['b','i','u'].forEach(id => $('#' + id).onclick = () => {
  if (!active) return; restoreSel();
  document.execCommand({b:'bold', i:'italic', u:'underline'}[id]); saveSoon();
});

/* ================= adding your notes ================= */
function makeNote(tag){
  const el = document.createElement(tag);
  el.className = 'mine'; el.contentEditable = 'true';
  el.style.fontFamily = `"${style.font}", cursive`; el.style.fontSize = style.size + 'px'; el.style.color = style.color;
  return el;
}
function focusNote(el){
  el.focus();
  const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  active = el; savedRange = r; hint();
}
function caretAt(x, y){
  if (document.caretPositionFromPoint) { const p = document.caretPositionFromPoint(x, y); return p && {node: p.offsetNode, offset: p.offset}; }
  const r = document.caretRangeFromPoint && document.caretRangeFromPoint(x, y);
  return r && {node: r.startContainer, offset: r.startOffset};
}
// a note box with handles on its right edge, bottom edge and corner, like a text box in Word
function addGrips(box){
  box.querySelectorAll(':scope > .grip').forEach(g => g.remove());
  if (!box.classList.contains('inline')) {
    const m = document.createElement('span'); m.className = 'grip g-move'; m.dataset.dir = 'move'; m.textContent = '✥';
    m.title = 'Drag to move this note'; m.setAttribute('aria-hidden', 'true');
    box.append(m);
  }
  for (const d of ['e', 's', 'se']) {
    const g = document.createElement('span'); g.className = 'grip g-' + d; g.dataset.dir = d;
    g.title = d === 'e' ? 'Drag to change the width' : d === 's' ? 'Drag to change the height' : 'Drag to resize';
    box.append(g);
  }
}
function makeBox(inline){
  const box = document.createElement(inline ? 'span' : 'div'); box.className = inline ? 'notebox inline' : 'notebox';
  const el = makeNote(inline ? 'span' : 'div');
  box.append(el); addGrips(box);
  return {box, el};
}
// notes made before resizing existed get a box and handles too
function upgradeNotes(){
  main.querySelectorAll('.notebox').forEach(b => { if (b.style.height) { b.style.minHeight = b.style.height; b.style.height = ''; } if (!b.classList.contains('inline') && !b.querySelector(':scope > .g-move')) addGrips(b); });
  main.querySelectorAll('.mine').forEach(el => {
    if (el.parentElement?.classList.contains('notebox')) { if (!el.parentElement.querySelector(':scope > .g-e')) addGrips(el.parentElement); return; }
    const inline = el.tagName === 'SPAN';
    const box = document.createElement(inline ? 'span' : 'div'); box.className = inline ? 'notebox inline' : 'notebox';
    el.replaceWith(box); box.append(el); addGrips(box);
  });
}
function addBlockNote(after, slide){
  const {box, el} = makeBox();
  if (after) after.after(box); else (slide.querySelector('.content') || slide).append(box);
  focusNote(el);
}
main.addEventListener('pointerdown', e => {
  const g = e.target.closest('.grip'); if (!g) return;
  if (g.dataset.dir === 'move') return startMove(g.parentElement, g, e);
  e.preventDefault();
  const box = g.parentElement, r = box.getBoundingClientRect(), sx = e.clientX, sy = e.clientY, dir = g.dataset.dir || 'se';
  const holder = box.closest('.content, .slide') || box.parentElement;
  const max = holder.getBoundingClientRect().right - r.left;
  g.setPointerCapture(e.pointerId);
  const move = ev => {
    if (dir.includes('e')) box.style.width = Math.round(Math.max(60, Math.min(max, r.width + ev.clientX - sx)) / viewZoom) + 'px';
    if (dir.includes('s')) { box.style.height = ''; box.style.minHeight = Math.round(Math.max(30, r.height + ev.clientY - sy) / viewZoom) + 'px'; }
  };
  const up = () => { g.removeEventListener('pointermove', move); g.removeEventListener('pointerup', up); g.removeEventListener('pointercancel', up); saveSoon(); };
  g.addEventListener('pointermove', move); g.addEventListener('pointerup', up); g.addEventListener('pointercancel', up);
});
main.addEventListener('click', e => {
  if (e.target.closest('.mine, .notebox, .gappill, details, summary, .slide-label, a')) return;
  const strip = e.target.closest('.strip');
  if (strip) { if (!getSelection().toString()) showGap(strip, e.clientY); return; }
  const slide = e.target.closest('.slide'); if (!slide) return;
  let blk = e.target.closest('.blk');
  if (!blk || e.target.tagName === 'IMG') {
    if (!blk) { const all = [...slide.querySelectorAll('.blk')].filter(b => b.getBoundingClientRect().top < e.clientY); blk = all.pop() || null; }
    while (blk && (blk.nextElementSibling?.classList.contains('mine') || blk.nextElementSibling?.classList.contains('notebox'))) blk = blk.nextElementSibling;
    return addBlockNote(blk, slide);
  }
  const c = caretAt(e.clientX, e.clientY);
  if (!c || c.node.nodeType !== 3 || !blk.contains(c.node)) return addBlockNote(blk, slide);
  const text = c.node.data; let off = c.offset;
  const r = document.createRange(); r.setStart(c.node, Math.min(off, text.length)); r.collapse(true);
  const rect = r.getClientRects()[0] || r.getBoundingClientRect();
  const tail = document.createRange(); tail.setStart(c.node, off); tail.setEndAfter(blk.lastChild);
  if (!tail.toString().trim() && e.clientX - rect.right > 24) return addBlockNote(blk, slide);
  while (off < text.length && !/\s/.test(text[off])) off++;   // snap to end of the clicked word
  const after = c.node.splitText(off);
  const {box, el} = makeBox(true);
  after.parentNode.insertBefore(box, after);
  focusNote(el);
});
main.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.closest?.('.mine')) { e.preventDefault(); document.execCommand('insertLineBreak'); }
});
main.addEventListener('input', saveSoon);
document.addEventListener('focusout', e => {
  const el = e.target.closest?.('.mine'); if (!el) return;
  setTimeout(() => {
    if (document.activeElement === el || $('header').contains(document.activeElement)) return;
    if (!el.textContent.trim() && !el.querySelector('img')) { const t = el.closest('.notebox') || el, p = t.parentNode; t.remove(); p && p.normalize(); mergeStrips(p); if (active === el) active = null; saveSoon(); }
  }, 0);
});

/* ================= reading files ================= */
function slideCard(){
  const s = document.createElement('section'); s.className = 'slide';
  s.innerHTML = `<div class="content"></div>`;
  main.append(s); return s;
}

// ---------- PowerPoint ----------
async function readPptx(buf, name){

  const xml = async p => { const f = zip.file(p); return f ? new DOMParser().parseFromString(await f.async('string'), 'application/xml') : null; };

  const find = (n, ln) => n ? n.getElementsByTagNameNS('*', ln)[0] || null : null;

  const pres = await xml('ppt/presentation.xml');

  const slideH = +(find(pres, 'sldSz')?.getAttribute('cy')) || 6858000;
  const firstCard = main.children.length;
  const ids = [...pres.getElementsByTagNameNS('*', 'sldId')].map(s => s.getAttribute('r:id'));
  for (let n = 0; n < ids.length; n++) {
    status(`Reading ${name}: slide ${n + 1} of ${ids.length}`);
    const path = resolve('ppt/presentation.xml', prel[ids[n]]);
    const doc = await xml(path); if (!doc) continue;
    const srel = rels(await xml(path.replace(/slides\/(slide\d+\.xml)$/, 'slides/_rels/$1.rels')));
    const items = [];
    let order = 0;
    const walk = node => {
      for (const c of node.children) {
        const ln = c.localName;
        if (ln === 'grpSp') { walk(c); continue; }
        if (ln === 'AlternateContent') {
          const fb = kid(c, 'Fallback'); const sp = fb && fb.firstElementChild;
          const choice = kid(c, 'Choice');
          const isMath = choice && choice.getElementsByTagNameNS('*', 'oMath').length;
          const blip = sp && find(sp, 'blip');
          if (isMath && blip) {
            const off = find(sp, 'off'), ext = find(sp, 'ext');
            items.push({c: sp, ln: 'pic', formula: true, phType: null, y: off ? +off.getAttribute('y') : 1e7, x: off ? +off.getAttribute('x') : 0, cx: ext ? +ext.getAttribute('cx') : 0, cy: ext ? +ext.getAttribute('cy') : 0, order: order++});
          } else if (choice) walk(choice);

        }
        if (!['sp', 'pic', 'graphicFrame'].includes(ln)) continue;
        const ph = find(c, 'ph'); const phType = ph ? (ph.getAttribute('type') || 'body') : null;
        const off = find(kid(c, 'spPr') || kid(c, 'xfrm') || c, 'off');
        const ext = find(kid(c, 'spPr') || c, 'ext');
        let y = off ? +off.getAttribute('y') : phType === 'title' || phType === 'ctrTitle' ? 0 : 1371600;
        items.push({c, ln, phType, y, x: off ? +off.getAttribute('x') : 0, cx: ext ? +ext.getAttribute('cx') : 0, cy: ext ? +ext.getAttribute('cy') : 0, order: order++});
      }
    };
    walk(find(doc, 'spTree'));
    items.sort((a, b) => (Math.abs(a.y - b.y) < 200000 ? a.x - b.x : a.y - b.y) || a.order - b.order);

    const card = slideCard();
    const box = card.querySelector('.content');

      if (it.ln === 'pic') {

        const img = document.createElement('img'); img.className = it.formula ? 'blk formula' : 'blk'; if (!it.formula) img.dataset.k = t;

        const t = document.createElement('table'); t.className = 'blk';

        }

  }

  function paras(body, phType, tag){
    if (!body) return [];
    const out = []; let num = 0;
    const base = phType === 'ctrTitle' ? 40 : phType === 'title' ? 32 : phType === 'subTitle' ? 22 : phType ? 20 : 18;
    for (const p of kids(body, 'p')) {
      const pPr = kid(p, 'pPr'); const lvl = +(pPr?.getAttribute('lvl') || 0);
      let html = '', firstSize = null;
      for (const r of p.children) {
        if (r.localName === 'br') { html += '<br>'; continue; }
        if (r.localName !== 'r' && r.localName !== 'fld') continue;
        const t = kid(r, 't')?.textContent || ''; if (!t) continue;
        const pr = kid(r, 'rPr');
        const sz = pr?.getAttribute('sz') ? +pr.getAttribute('sz') / 100 * 0.8 : base - lvl * 2;
        firstSize ??= sz;
        const st = [`font-size:${px(sz)}px`];
        if (pr?.getAttribute('b') === '1') st.push('font-weight:700');
        if (pr?.getAttribute('i') === '1') st.push('font-style:italic');
        if (pr?.getAttribute('u') && pr.getAttribute('u') !== 'none') st.push('text-decoration:underline');
        const clr = find(kid(pr, 'solidFill'), 'srgbClr')?.getAttribute('val');
        if (clr && !isLight(clr)) st.push('color:#' + clr);
        const face = kid(pr, 'latin')?.getAttribute('typeface');
        if (face && !face.startsWith('+')) st.push(`font-family:'${face.replace(/'/g, '')}',system-ui,sans-serif`);
        html += `<span style="${st.join(';')}">${esc(t)}</span>`;
      }
      if (!html.replace(/<br>/g, '')) continue;
      if ((phType === 'title' || phType === 'ctrTitle') && !/font-weight/.test(html)) html = `<span style="font-weight:700">${html}</span>`;
      let bullet = '';
      const buChar = kid(pPr, 'buChar')?.getAttribute('char');
      if (kid(pPr, 'buNone')) bullet = '';
      else if (kid(pPr, 'buAutoNum')) bullet = (++num) + '.';
      else if (buChar) bullet = buChar;
      else if (phType === 'body' || phType === 'obj') bullet = '•';
      const bul = bullet ? `<span class="bul" style="font-size:${px(firstSize || base)}px">${esc(bullet)}</span>` : '';
      out.push(tag === 'span' ? bul + html : `<div class="blk" style="margin-left:${lvl * 1.6 + (bullet ? 0.2 : 0)}em">${bul}${html}</div>`);
    }
    return out;
  }
}

// background and decoration: covers most of the slide, or a big/stretched strip touching an edge
function isBackground(x0, y0, x1, y1, W, H){
  const w = x1 - x0, h = y1 - y0; if (w <= 0 || h <= 0) return true;
  const area = (w * h) / (W * H), stretch = Math.max(w / h, h / w);
  const edge = x0 <= W * 0.01 || x1 >= W * 0.99 || y0 <= H * 0.01 || y1 >= H * 0.99;

}

function imgToUrl(img){
  try {
    const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
    const ctx = c.getContext('2d');
    if (img.bitmap) ctx.drawImage(img.bitmap, 0, 0);
    else if (img.data) {
      const id = ctx.createImageData(img.width, img.height), d = img.data, o = id.data, n = img.width * img.height;
      if (img.kind === 3) o.set(d.subarray(0, n * 4));
      else if (img.kind === 2) for (let i = 0; i < n; i++) { o[i*4] = d[i*3]; o[i*4+1] = d[i*3+1]; o[i*4+2] = d[i*3+2]; o[i*4+3] = 255; }
      else { const rb = (img.width + 7) >> 3; for (let y = 0; y < img.height; y++) for (let x = 0; x < img.width; x++) { const v = (d[y*rb + (x >> 3)] >> (7 - (x & 7))) & 1 ? 255 : 0; const i = (y*img.width + x) * 4; o[i] = o[i+1] = o[i+2] = v; o[i+3] = 255; } }
      ctx.putImageData(id, 0, 0);
    } else return null;
    return c.toDataURL(img.kind === 3 ? 'image/png' : 'image/jpeg', 0.85);
  } catch { return null; }
}

function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function paintCard(card, scale){
  const r = card.getBoundingClientRect(), ox = r.left, oy = r.top;
  const c = document.createElement('canvas');
  c.width = Math.round(r.width * scale); c.height = Math.round(r.height * scale);
  const ctx = c.getContext('2d'); ctx.scale(scale, scale);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, r.width, r.height);
  const pcs = card.classList.contains('pagecard') ? [card] : [...card.querySelectorAll('.pagecard')];
  for (const pc of pcs) {
    const m = pc.style.getPropertyValue('--pg').match(/url\(["']?(.*?)["']?\)$/);
    if (!m) continue;
    const img = await loadImg(m[1]), H = +pc.dataset.h;
    for (const s of pc.querySelectorAll(':scope > .strip')) {
      const sr = s.getBoundingClientRect(), y0 = +s.dataset.y0, y1 = +s.dataset.y1;
      ctx.drawImage(img, 0, y0 / H * img.naturalHeight, img.naturalWidth, (y1 - y0) / H * img.naturalHeight, sr.left - ox, sr.top - oy, sr.width, sr.height);
    }
  }
  for (const im of card.querySelectorAll('img')) {
    if (im.closest('details:not([open])')) continue;
    const ir = im.getBoundingClientRect(); if (!ir.width || !im.complete) continue;
    try { ctx.drawImage(im, ir.left - ox, ir.top - oy, ir.width, ir.height); } catch {}
  }
  ctx.strokeStyle = '#9aa3b2'; ctx.lineWidth = 1;
  for (const n of card.querySelectorAll('.mine')) {
    for (const nr of n.getClientRects()) ctx.strokeRect(nr.left - ox + .5, nr.top - oy + .5, nr.width - 1, nr.height - 1);
  }
  ctx.strokeStyle = '#c9d0db';
  for (const td of card.querySelectorAll('td, th')) { const tr = td.getBoundingClientRect(); ctx.strokeRect(tr.left - ox, tr.top - oy, tr.width, tr.height); }
  // text, word by word, exactly where the browser laid it out
  const walker = document.createTreeWalker(card, NodeFilter.SHOW_TEXT);
  const range = document.createRange();
  for (let t = walker.nextNode(); t; t = walker.nextNode()) {
    const el = t.parentElement;
    if (!el || !t.data.trim() || el.closest('.tl, .grip, .gappill, .gapline, summary, details:not([open])')) continue;
    const cs = getComputedStyle(el);
    if (cs.visibility === 'hidden' || cs.color === 'transparent' || cs.color === 'rgba(0, 0, 0, 0)') continue;
    ctx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    ctx.fillStyle = cs.color; ctx.textBaseline = 'alphabetic';
    const underline = /underline/.test(cs.textDecorationLine || cs.textDecoration);
    for (const w of t.data.matchAll(/\S+/g)) {
      range.setStart(t, w.index); range.setEnd(t, w.index + w[0].length);
      const rects = range.getClientRects(); if (!rects.length) continue;
      const wr = rects[0], mt = ctx.measureText(w[0]);
      const asc = mt.fontBoundingBoxAscent || parseFloat(cs.fontSize) * 0.8, desc = mt.fontBoundingBoxDescent || parseFloat(cs.fontSize) * 0.2;
      const y = wr.top - oy + (wr.height - (asc + desc)) / 2 + asc;
      ctx.fillText(w[0], wr.left - ox, y);
      if (underline) ctx.fillRect(wr.left - ox, y + 2, wr.width, Math.max(1, parseFloat(cs.fontSize) / 16));
    }
  }
  return c;
}
function makePdf(pages){
  const enc = new TextEncoder(), chunks = [], offs = [];
  let len = 0;
  const push = d => { const b = typeof d === 'string' ? enc.encode(d) : d; chunks.push(b); len += b.length; };
  const obj = (num, ...parts) => { offs[num] = len; push(`${num} 0 obj\n`); parts.forEach(push); push('\nendobj\n'); };
  push('%PDF-1.4\n%âãÏÓ\n');
  const n = pages.length, total = 2 + n * 3;
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, `<< /Type /Pages /Kids [${pages.map((_, i) => `${3 + i * 3} 0 R`).join(' ')}] /Count ${n} >>`);
  pages.forEach((p, i) => {
    const pg = 3 + i * 3, ct = pg + 1, im = pg + 2;
    const pw = p.pw || 595.28, ph = p.ph || +(pw * p.h / p.w).toFixed(2);
    const content = `q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
    obj(pg, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${ct} 0 R >>`);
    obj(ct, `<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
    obj(im, `<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpeg.length} >>\nstream\n`, p.jpeg, '\nendstream');
  });
  const xref = len;
  push(`xref\n0 ${total + 1}\n0000000000 65535 f \n` + offs.slice(1).map(o => String(o).padStart(10, '0') + ' 00000 n \n').join(''));
  push(`trailer\n<< /Size ${total + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(chunks, {type: 'application/pdf'});
}
async function downloadPdf(){
  hideGap();

  try { await document.fonts.ready; } catch {}
  const size = LAYOUTS[layout];
  if (size) paginateView();
  const cards = size ? [...main.querySelectorAll('.sheet')] : [...main.querySelectorAll('.slide')];
  const sheets = [];
  for (let i = 0; i < cards.length; i++) {
    status(`Making your PDF: page ${i + 1} of ${cards.length}`);
    const canvas = await paintCard(cards[i], 2 / viewZoom);
    sheets.push(size ? {canvas, pw: size[0], ph: size[1]} : {canvas});
  }
  const pages = [];

    const blob = await new Promise(res => sh.canvas.toBlob(res, 'image/jpeg', 0.9));
    pages.push({w: sh.canvas.width, h: sh.canvas.height, pw: sh.pw, ph: sh.ph, jpeg: new Uint8Array(await blob.arrayBuffer())});
  }
  await saveFile(notebookName() + (size ? ` (notes, ${layout.replace('-', ' ')})` : ' (notes)') + '.pdf', makePdf(pages));
}

// page sizes in points (1/72 inch)
const LAYOUTS = {'default': null, 'a4-portrait': [595.28, 841.89], 'a4-landscape': [841.89, 595.28], 'a3-portrait': [841.89, 1190.55], 'a3-landscape': [1190.55, 841.89]};
let layout = 'default';
try { const l = localStorage.getItem('pdf-layout'); if (l && l in LAYOUTS) layout = l; } catch {}
$('#layout').value = layout;
$('#layout').onchange = e => { layout = e.target.value; try { localStorage.setItem('pdf-layout', layout); } catch {} paginateView(); };
// ================= page layout on screen: A4 / A3 sheets, portrait or landscape =================
let viewZoom = 1, pageTimer = null;
const pxSize = ([pw, ph]) => [Math.round(pw * 96 / 72), Math.round(ph * 96 / 72)];   // points to screen pixels
const SHEET_MARGIN = 48, SHEET_GAP = 14;
// undo the sheets: back to one list of headings and slides, with split slides joined up again
function flatten(root){
  const sheets = [...root.querySelectorAll(':scope > .sheet')];
  if (sheets.length) {
    const items = []; sheets.forEach(s => items.push(...s.children));
    sheets.forEach(s => s.remove());
    items.forEach(i => root.append(i));
  }
  for (const c of [...root.querySelectorAll(':scope > .cont')]) {
    const prev = c.previousElementSibling;
    if (prev && prev.dataset.pid && prev.dataset.pid === c.dataset.pid) { while (c.firstChild) prev.append(c.firstChild); c.remove(); mergeStrips(prev); }
    else c.classList.remove('cont');
  }
}
function measureStrip(s){
  s.querySelectorAll('.tl').forEach(sp => {
    if (sp.style.transform || !s.isConnected) return;
    const target = +sp.dataset.w * s.getBoundingClientRect().width, actual = sp.getBoundingClientRect().width;
    if (actual > 0 && target > 0) sp.style.transform = `scaleX(${(target / actual).toFixed(4)})`;
  });
}
function paginateView(){
  clearTimeout(pageTimer);
  const sel = getSelection(), keep = sel.rangeCount ? [sel.anchorNode, sel.anchorOffset, sel.focusNode, sel.focusOffset] : null;
  const focused = document.activeElement, scrollY = window.scrollY;
  hideGap();
  flatten(main);
  const size = LAYOUTS[layout];
  main.classList.toggle('paged', !!size);
  if (!size || !main.querySelector('.slide')) {
    main.style.zoom = ''; viewZoom = 1;
  } else {
    const [W, H] = pxSize(size);
    main.style.setProperty('--sheet-w', W + 'px'); main.style.setProperty('--sheet-h', H + 'px');
    const avail = document.documentElement.clientWidth - 32;
    viewZoom = Math.min(1, avail / W); main.style.zoom = viewZoom === 1 ? '' : viewZoom;
    const z = viewZoom, ROOM = (H - 2 * SHEET_MARGIN) * z;
    const items = [...main.children];
    items.forEach(i => i.remove());
    let sheet = null;
    const newSheet = () => { sheet = document.createElement('div'); sheet.className = 'sheet'; main.append(sheet); };
    const used = () => { const last = sheet.lastElementChild; return last ? last.getBoundingClientRect().bottom - sheet.getBoundingClientRect().top - SHEET_MARGIN * z : 0; };
    newSheet();
    for (const it of items) {
      if (it.classList.contains('pagecard') && !it.dataset.pid) it.dataset.pid = Math.random().toString(36).slice(2, 10);
      const before = used();
      sheet.append(it);
      if (used() <= ROOM) continue;
      if (!it.classList.contains('pagecard')) { if (before > 0) { newSheet(); sheet.append(it); } continue; }
      // the slide doesn't fit: keep what fits on this sheet and carry the rest over, breaking at a gap between lines
      let card = it;
      for (let guard = 0; guard < 50 && used() > ROOM; guard++) {
        const top = card.getBoundingClientRect().top, room = ROOM - (top - sheet.getBoundingClientRect().top - SHEET_MARGIN * z);
        let cut = null;
        for (const k of [...card.children]) {
          const r = k.getBoundingClientRect();
          if (r.bottom - top <= room) continue;
          if (k.classList.contains('strip')) {
            const y0 = +k.dataset.y0, y1 = +k.dataset.y1, scale = r.height / (y1 - y0);
            const limit = y0 + (room - (r.top - top)) / scale;
            const gaps = JSON.parse(card.dataset.gaps || '[]').map(([a, b]) => (a + b) / 2).filter(g => g > y0 + 4 && g < limit);
            if (gaps.length) { const g = gaps.pop(); const a = makeStrip(card, y0, g), b = makeStrip(card, g, y1); k.replaceWith(a, b); cut = b; }
            else cut = k;
          } else cut = k;
          break;
        }
        if (!cut) break;
        if (cut === card.firstElementChild) {             // nothing of this slide fits here: move it all to a new sheet
          if (sheet.firstElementChild === card) break;
          newSheet(); sheet.append(card); continue;
        }
        const rest = card.cloneNode(false); rest.classList.add('cont');
        for (let x = cut; x; ) { const nx = x.nextElementSibling; rest.append(x); x = nx; }
        newSheet(); sheet.append(rest); card = rest;
      }
    }
    main.querySelectorAll('.strip').forEach(measureStrip);
  }
  window.scrollTo(0, scrollY);
  if (focused && focused.isConnected && focused.classList?.contains('mine')) {
    focused.focus({preventScroll: true});
    if (keep && keep[0] && focused.contains(keep[0])) { try { sel.setBaseAndExtent(keep[0], keep[1], keep[2], keep[3]); } catch {} }
    savedRange = sel.rangeCount ? sel.getRangeAt(0).cloneRange() : savedRange;
  }
}

showEmpty();
(async () => {
  db = await openDb();
  const emb = document.getElementById('notebook-data');
  if (emb) { try { loadNotebook(JSON.parse(emb.textContent), true); saveSoon(); return; } catch {} }
  if (!db) return;
  const [d, s, n] = await Promise.all([get('doc'), get('style'), get('count')]);
  if (s) { style = s; showStyle(style); }
  if (d) { main.innerHTML = d; slideCount = n || 0; main.querySelectorAll('.slide-label').forEach(e => e.remove()); upgradeNotes(); }
  requestAnimationFrame(() => { main.querySelectorAll('.strip').forEach(measureStrip); paginateView(); });
})();
</script>

</body>
